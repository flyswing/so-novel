name: Docker Custom (flyswing/custom)

on:
  workflow_dispatch:
  push:
    branches:
      - flyswing/custom
    paths:
      - 'src/**'
      - 'bundle/**'
      - 'docker/**'
      - 'Dockerfile'
      - 'pom.xml'
      - 'bin/docker-build.sh'
      - '.github/workflows/docker-custom.yml'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout flyswing/custom
        uses: actions/checkout@v5
        with:
          ref: flyswing/custom

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Build app.jar
        run: mvn -q clean package -Dmaven.test.skip=true

      - name: Prepare Docker build context
        run: |
          mkdir -p .docker-build/rules
          cp target/app-jar-with-dependencies.jar .docker-build/app.jar
          cp docker/config.ini .docker-build/config.ini
          cp -r bundle/rules/. .docker-build/rules/

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .docker-build
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:custom
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
