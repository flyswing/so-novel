name: Docker Custom (flyswing/custom)

on:
  workflow_dispatch:
  push:
    branches:
      - flyswing/custom
    paths:
      - 'src/**'
      - 'bundle/**'
      - 'docker/**'
      - 'Dockerfile'
      - 'pom.xml'
      - 'bin/docker-build.sh'
      - '.github/workflows/docker-custom.yml'

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout flyswing/custom
        uses: actions/checkout@v5
        with:
          ref: flyswing/custom

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Maven
        run: sudo apt-get update && sudo apt-get install -y maven

      - name: Build app.jar
        run: mvn -q clean package -Dmaven.test.skip=true

      - name: Prepare Docker build context
        run: |
          mkdir -p .docker-build/rules
          cp target/app-jar-with-dependencies.jar .docker-build/app.jar
          cp docker/config.ini .docker-build/config.ini
          cp -r bundle/rules/. .docker-build/rules/

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/sonovel
          SHORT_SHA="${GITHUB_SHA::7}"
          docker build -f Dockerfile -t "$IMAGE:custom" -t "$IMAGE:latest" -t "$IMAGE:sha-$SHORT_SHA" .docker-build
          docker push "$IMAGE:custom"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-$SHORT_SHA"
          echo "Published: $IMAGE:custom, $IMAGE:latest, $IMAGE:sha-$SHORT_SHA"
