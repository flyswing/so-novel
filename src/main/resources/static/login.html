<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
        name="viewport">
  <meta content="yes" name="mobile-web-app-capable">
  <meta content="yes" name="apple-mobile-web-app-capable">
  <title>登录 · SoNovel</title>
  <link href="favicon.ico" rel="icon">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#5d5d81', 'primary-hover': '#7b7b9d' },
          fontFamily: {
            sans: ['Roboto', 'Helvetica Neue', 'Helvetica', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen" x-data="LoginPage()" x-init="init()" x-cloak>

<div class="min-h-screen flex flex-col items-center justify-center px-4 py-10">
  <header class="flex flex-col items-center mb-8">
    <h1 class="m-0 flex items-baseline gap-2">
      <span class="text-3xl sm:text-4xl font-light text-gray-700 tracking-wide">SO</span>
      <span class="text-3xl sm:text-4xl font-light text-gray-700 tracking-wide">NOVEL</span>
    </h1>
    <div class="mt-3 h-px w-20 bg-gradient-to-r from-transparent via-primary/30 to-transparent"></div>
    <p class="mt-3 text-sm text-gray-500">登录后继续使用 WebUI</p>
  </header>

  <section class="w-full max-w-md bg-white rounded-xl shadow-md p-6 sm:p-8">
    <h2 class="text-lg sm:text-xl font-semibold text-primary border-l-4 border-primary pl-3 mb-6">登录</h2>

    <form class="flex flex-col gap-4" @submit.prevent="submit">
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-gray-600" for="username">用户名</label>
        <input id="username" autocomplete="username" x-model="username"
               class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10"
               placeholder="admin" type="text" required>
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium text-gray-600" for="password">密码</label>
        <input id="password" autocomplete="current-password" x-model="password"
               class="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm bg-white focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/10"
               placeholder="请输入密码" type="password" required>
      </div>

      <p class="text-sm text-red-600 min-h-[1.25rem]" x-text="error" x-show="error"></p>

      <button type="submit"
              class="mt-1 w-full rounded-lg bg-primary hover:bg-primary-hover text-white text-sm font-medium py-2.5 transition-colors disabled:opacity-60"
              :disabled="loading"
              x-text="loading ? '登录中…' : '登录'"></button>
    </form>
  </section>

  <p class="mt-6 text-xs text-gray-400">可在 config.ini 的 [web] 中配置 username / password</p>
</div>

<script>
  function LoginPage() {
    return {
      username: 'admin',
      password: '',
      error: '',
      loading: false,

      async init() {
        try {
          const r = await fetch('/auth/status', { credentials: 'same-origin' })
          const json = await r.json()
          const data = json.data || {}
          if (!data.enabled || data.authenticated) {
            location.replace('/')
          }
        } catch (_) {
          // ignore, stay on login page
        }
      },

      async submit() {
        this.error = ''
        this.loading = true
        try {
          const r = await fetch('/login', {
            method: 'POST',
            credentials: 'same-origin',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify({ username: this.username.trim(), password: this.password })
          })
          const json = await r.json().catch(() => ({}))
          if (!r.ok) {
            this.error = json.message || '登录失败'
            return
          }
          location.replace('/')
        } catch (e) {
          this.error = '网络错误，请稍后重试'
        } finally {
          this.loading = false
        }
      }
    }
  }
</script>
</body>
</html>
