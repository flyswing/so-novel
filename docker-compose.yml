services:
  sonovel:
    # GHCR: ghcr.io/flyswing/so-novel:custom
    image: ${SONOVEL_IMAGE:-ghcr.io/flyswing/so-novel:custom}
    container_name: sonovel
    ports:
      - "7765:7765"
    environment:
      JAVA_OPTS: "-Dmode=web"
    volumes:
      - ./docker/data/config.ini:/sonovel/config.ini
      - ./docker/data/downloads:/sonovel/downloads
      - ./docker/data/rules:/sonovel/rules
    restart: unless-stopped
