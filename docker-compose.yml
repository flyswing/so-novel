services:
  sonovel:
    # 本地构建: flyswing/sonovel:custom
    # GHCR 镜像: ghcr.io/flyswing/sonovel:custom
    image: ${SONOVEL_IMAGE:-flyswing/sonovel:custom}
    container_name: sonovel
    ports:
      - "7765:7765"
    environment:
      JAVA_OPTS: "-Dmode=web"
    volumes:
      - ./docker/data/config.ini:/sonovel/config.ini
      - ./docker/data/downloads:/sonovel/downloads
      - ./docker/data/rules:/sonovel/rules
    restart: unless-stopped
